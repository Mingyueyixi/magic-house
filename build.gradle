// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = "2.0.20"
}
plugins {
    id 'com.android.application' version '8.5.2' apply false
    id 'com.android.library' version '8.5.2' apply false
    id 'org.jetbrains.kotlin.android' version "$kotlin_version" apply false
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

static def getModuleNameSpace(Project project) {
    def projectName = project.getName()
    return "com.lu.magic." + projectName.replace("-", "").toLowerCase(Locale.US)
}

subprojects { project ->
    afterEvaluate {
        if (plugins.hasPlugin('com.android.library') || plugins.hasPlugin('com.android.application')) {
            android {
                if (it.namespace == null || it.namespace == "") {
                    // 未设置，则统一设置
                    def projectNamespace = getModuleNameSpace(project)
                    println("set namespace: $projectNamespace")
                    namespace(projectNamespace)
                } else {
                    // 设置了，则不处理
                    println("custom namespace: ${it.namespace}")
                }
            }
        }
    }
}